<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline : SpoolStack</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #5f5f5f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #a3a3a3; } }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
        padding: 10px 20px; background: var(--fg); color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        SpoolStack needs a connection to load your log and save runs. Nothing has been lost; reconnect and try
        again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
